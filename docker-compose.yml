services:
  redis-stack:
    image: docker.io/library/redis:8.10.0
    command: ["redis-server", "/redis-stack.conf"]
    ports:
      - "${ZRR_PORT:-6379}:6379"
    volumes:
      - "${ZRR_DATA_DIR:-./.zotero-redisearch-rag/redis-data}:/data"
      - "./redis-stack.conf:/redis-stack.conf:ro"

  redis-insight:
    image: docker.io/redis/redisinsight:3.8.0
    depends_on:
      - redis-stack
    environment:
      - RI_REDIS_HOST=redis-stack
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=Zotero Research Assistant
    ports:
      - "${ZRR_INSIGHT_PORT:-8001}:5540"
    volumes:
      - "redis-insight-data:/data"

  python-worker:
    build:
      context: "${ZRR_PLUGIN_DIR:-.}"
      dockerfile: tools/python-worker.Dockerfile
      args:
        ZRR_TESSERACT_LANG_PACKS: "${ZRR_TESSERACT_LANG_PACKS:-eng deu fra spa ita nld por pol swe}"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ZRR_WORKER_REQUIREMENTS=${ZRR_WORKER_REQUIREMENTS:-/workspace/plugin/tools/requirements.txt}
      - ZRR_WORKER_VENV_DIR=/workspace/cache/venv
      - DOCLING_ARTIFACTS_PATH=/workspace/cache/docling/models
      - HF_HOME=/workspace/cache/huggingface
      - HF_HUB_CACHE=/workspace/cache/huggingface/hub
      - XDG_CACHE_HOME=/workspace/cache/xdg
      - ZRR_DOCLING_PREFETCH=${ZRR_DOCLING_PREFETCH:-1}
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - DISABLE_MODEL_SOURCE_CHECK=True
    ports:
      - "${ZRR_WORKER_PORT:-7379}:7379"
    volumes:
      - "${ZRR_PLUGIN_DIR:-.}:/workspace/plugin:ro"
      - "${ZRR_VAULT_DIR:-.}:/workspace/vault"
      - "${ZRR_WORKER_CACHE_DIR:-~/.cache/zotero-redisearch-rag}:/workspace/cache"

volumes:
  redis-insight-data:
