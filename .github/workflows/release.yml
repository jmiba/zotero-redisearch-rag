name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generate bundled release notes from GitHub release body
        if: ${{ hashFiles('scripts/generate-release-notes.mjs') != '' && hashFiles('src/releaseNotes.ts') != '' }}
        continue-on-error: true
        env:
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_RELEASE_BODY: ${{ github.event.release.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-notes.mjs
      - run: npm run package-release
      - name: Verify release artifacts
        run: |
          ls -lah main.js manifest.json versions.json styles.css
          ls -lah dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            versions.json
            styles.css
            dist/*.zip
