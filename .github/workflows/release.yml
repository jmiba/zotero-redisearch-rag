name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generate bundled release notes from GitHub release body
        if: ${{ hashFiles('scripts/generate-release-notes.mjs') != '' && hashFiles('src/releaseNotes.ts') != '' }}
        continue-on-error: true
        env:
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_RELEASE_BODY: ${{ github.event.release.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-notes.mjs
      - run: npm run build:release
      - name: Verify community release artifacts
        run: |
          ls -lah main.js manifest.json styles.css
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Remove unsupported release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name != "main.js" and .name != "manifest.json" and .name != "styles.css") | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r asset_id asset_name; do
            echo "Deleting unsupported release asset: ${asset_name}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
