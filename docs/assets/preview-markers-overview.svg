<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Preview mode marker badges</title>
  <desc id="desc">Sample document view with marker badges styled like Obsidian preview badges: sync start, page badges, excluded page badge, page end, and sync end.</desc>
  <rect width="1280" height="860" fill="#f3f4f6"/>

  <rect x="80" y="52" width="1120" height="756" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <rect x="80" y="52" width="1120" height="56" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="88" fill="#0f172a" font-size="24" font-family="Arial, Helvetica, sans-serif">Sample note (Preview mode)</text>

  <rect x="112" y="138" width="636" height="54" rx="27" fill="#ececec" stroke="#d8dadd" stroke-width="3"/>
  <text x="136" y="174" fill="#5b6571" font-size="22" font-family="Arial, Helvetica, sans-serif">Redis Index Sync start - 7TAJEI8C</text>

  <rect x="112" y="228" width="210" height="54" rx="27" fill="#ececec" stroke="#d8dadd" stroke-width="3"/>
  <text x="136" y="264" fill="#75808c" font-size="22" font-family="Arial, Helvetica, sans-serif">Page 2/320</text>

  <text x="112" y="338" fill="#23262b" font-size="30" font-family="Arial, Helvetica, sans-serif">The Sultana Tragedy</text>
  <text x="112" y="382" fill="#4b5563" font-size="21" font-family="Arial, Helvetica, sans-serif">JERRY O. POTTER</text>

  <rect x="112" y="430" width="312" height="54" rx="27" fill="#f8f8f8" stroke="#ff4a62" stroke-width="3"/>
  <text x="136" y="466" fill="#ef344d" font-size="22" font-family="Arial, Helvetica, sans-serif">Page 1/320 - excluded</text>

  <text x="112" y="536" fill="#2c2c2f" font-size="30" font-family="Arial, Helvetica, sans-serif">Tragedy America's Greatest Maritime Disaster SULTANA</text>

  <rect x="112" y="582" width="170" height="54" rx="27" fill="#ececec" stroke="#d8dadd" stroke-width="3"/>
  <text x="136" y="618" fill="#7a848f" font-size="22" font-family="Arial, Helvetica, sans-serif">Page end</text>

  <rect x="112" y="672" width="430" height="54" rx="27" fill="#ececec" stroke="#d8dadd" stroke-width="3"/>
  <text x="136" y="708" fill="#6f7a86" font-size="22" font-family="Arial, Helvetica, sans-serif">Redis Index Sync end</text>
</svg>
