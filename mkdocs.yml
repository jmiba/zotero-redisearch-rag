site_name: Zotero Redis RAG
site_description: Ask questions across your Zotero library inside Obsidian.
repo_url: https://github.com/jmiba/zotero-redisearch-rag
repo_name: jmiba/zotero-redisearch-rag
site_url: https://jmiba.github.io/zotero-redisearch-rag/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quick-start.md
      - How It Works: how-it-works.md
      - Core Concepts: core-concepts.md
  - Usage:
      - Daily Workflow: daily-workflow.md
      - Chat Panel: chat-panel.md
      - PDF Handling: pdf-handling.md
      - Annotations: annotations.md
  - Reference:
      - Retrieval and Ranking: retrieval-ranking.md
      - Settings Reference: settings-reference.md
      - Command Palette Reference: command-palette-reference.md
      - Files and Data Locations: files-and-data-locations.md
  - Troubleshooting: troubleshooting.md
  - Advanced Usage: advanced-usage.md
  - Privacy and Security: privacy-and-security.md
  - FAQ: faq.md
